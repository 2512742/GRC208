[project]
name = "risktrack-backend"
version = "0.1.0"
description = "RiskTrack: Cyber Risk Register and Treatment Management Platform (GRC208 Group 1) - API"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = ["B008"]  # FastAPI's Depends() in argument defaults is the intended pattern

[tool.ruff.lint.isort]
# backend/alembic/ (our migrations folder) must not make the alembic library look first-party.
known-third-party = ["alembic"]
known-first-party = ["app", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S608"]  # asserts, dummy secrets, test SQL
"alembic/versions/**" = ["E501"]  # autogenerated SQL strings

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
