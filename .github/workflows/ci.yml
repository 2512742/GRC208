name: CI

# The app lives in WS1-development/app; only changes there run the tests.
on:
  push:
    branches: [main]
    paths: ["WS1-development/app/**", ".github/workflows/**"]
  pull_request:
    paths: ["WS1-development/app/**", ".github/workflows/**"]

permissions:
  contents: read

jobs:
  backend-sqlite:
    name: Backend (SQLite, Python 3.13)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: WS1-development/app/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: WS1-development/app/backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest --cov=app --cov-report=term-missing

  backend-postgres:
    name: Backend (PostgreSQL 18, Python 3.12 as on Vercel)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: risktrack
          POSTGRES_PASSWORD: risktrack
          POSTGRES_DB: risktrack_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U risktrack"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: WS1-development/app/backend
    env:
      TEST_DATABASE_URL: postgresql://risktrack:risktrack@localhost:5432/risktrack_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: WS1-development/app/backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: WS1-development/app/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: WS1-development/app/frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
